name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          project_version="$(./gradlew -q properties | sed -n 's/^version: //p' | head -n 1)"
          if [[ -z "$project_version" ]]; then
            echo "Unable to determine the project version" >&2
            exit 1
          fi

          if [[ "$project_version" == *SNAPSHOT* ]]; then
            echo "Refusing to publish snapshot version: $project_version" >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" != "$project_version" && "$RELEASE_TAG" != "v$project_version" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match project version '$project_version'" >&2
            exit 1
          fi

      - name: Validate and publish plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew validatePlugins publishPlugins
